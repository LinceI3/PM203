<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cafetería UPQ</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
padding:40px;
margin:0;
}

.menu{
background:white;
max-width:1200px;
width:100%;
margin:auto;
padding:30px;
border-radius:15px;
box-shadow:0 4px 12px rgba(0,0,0,.2);
max-height:80vh;
overflow-y:auto;
}

.producto{
background:#ececec;
padding:20px;
border-radius:15px;
min-height:260px;
display:flex;
flex-direction:column;
justify-content:space-between;
}

#productos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
margin-top:20px;
}

h1{
text-align:center;
margin-bottom:30px;
}

#pedidos{
background:#f7f7f7;
padding:10px;
border-radius:8px;
margin-bottom:10px;
}

button{
background:#8B4513;
color:white;
border:none;
padding:10px;
border-radius:8px;
width:auto;
min-width:180px;
margin-top:10px;
cursor:pointer;
}

button:hover{
background:#6d3410;
}

#productos button{
width:100%;
margin-top:20px;
}

#total{
color:green;
font-size:20px;
}
</style>
</head>
<body>
<div class="menu">
<h1> CAFETERÍA UPQ</h1>

<h2> Filtros</h2>

<button onclick="mostrarFiltro('todos')">Todos</button>
<button onclick="mostrarFiltro('baratos')">Productos baratos</button>
<button onclick="mostrarFiltro('caros')">Productos caros</button>
<button onclick="mostrarFiltro('bebidas')">Bebidas</button>
<button onclick="mostrarFiltro('postres')">Postres</button>

<hr>

<h2>Menú dinámico</h2>
<div id="productos"></div>

<hr>

<h2> Pedidos actuales</h2>
<div id="pedidos">
<p>No hay pedidos aún</p>
</div>

<hr>

<h2> Caja</h2>
<p id="subtotal">Subtotal: $0</p>
<p id="iva">IVA: $0</p>
<p id="total"><b>Total: $0</b></p>
</div>

<script src="Integracion.js"></script>
</body>
</html>
